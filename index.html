<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">Universal Media Hub</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#e11d48">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col font-sans p-4 items-center">

  <div class="max-w-md mx-auto w-full flex flex-col gap-5">
    
    <!-- Yuxarı Reklam Konteyneri -->
    <div id="topAdsContainer" class="flex flex-col gap-3"></div>

    <!-- Header & Dil Seçimi -->
    <header class="text-center py-4 border-b border-slate-800 flex flex-col items-center relative">
      <div class="absolute top-2 right-2">
        <select id="langSelect" onchange="changeLanguage(this.value)" class="bg-slate-900 border border-slate-800 text-rose-400 font-bold text-[11px] rounded-lg px-2 py-1 focus:outline-none">
          <option value="az">🇦🇿 AZ</option>
          <option value="en">🇬🇧 EN</option>
          <option value="ru">🇷🇺 RU</option>
        </select>
      </div>

      <div class="w-14 h-14 bg-rose-600/20 text-rose-500 rounded-2xl flex items-center justify-center mb-2 shadow-lg overflow-hidden border border-slate-800">
        <img id="siteLogoImg" src="" class="w-full h-full object-cover hidden" alt="Logo">
        <i id="siteLogoIcon" data-lucide="smartphone" class="w-7 h-7"></i>
      </div>

      <h1 id="t_title" class="text-xl font-bold text-white">Universal Media Hub</h1>
      <p id="t_subtitle" class="text-xs text-slate-400">Web & Tətbiq Yükləyici</p>
      
      <button id="installBtn" onclick="installApp()" class="hidden mt-3 px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-bold text-[11px] rounded-xl transition flex items-center gap-1 shadow-md">
        <i data-lucide="download-cloud" class="w-3.5 h-3.5"></i>
        <span id="t_install_app">Tətbiqi Quraşdır</span>
      </button>
    </header>

    <!-- Link Girişi -->
    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col gap-3 shadow-xl">
      <label id="t_input_label" class="text-xs font-medium text-slate-300">Media Linkini Daxil Edin:</label>
      <input type="url" id="mediaUrl" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-rose-500">
      
      <button onclick="analyzeUrl()" id="analyzeBtn" class="w-full py-3 bg-rose-600 hover:bg-rose-500 font-bold text-xs rounded-xl transition flex items-center justify-center gap-2">
        <span id="t_analyze_btn">Analiz Et</span>
      </button>
    </div>

    <!-- Analiz Nəticəsi & Format Seçimləri -->
    <div id="resultBox" class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col gap-4 hidden shadow-xl">
      <div id="mediaInfo" class="text-xs font-semibold text-rose-400 border-b border-slate-800 pb-2"></div>

      <div>
        <label id="t_select_type_label" class="block text-xs text-slate-400 mb-1">Nə kimi hazırlansın?</label>
        <select id="downloadType" onchange="updateFormats()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
          <option id="t_video_opt" value="video">🎥 Video (MP4)</option>
          <option id="t_audio_opt" value="audio">🎵 Musiqi / Audio (MP3)</option>
          <option id="t_image_opt" value="image">🖼️ Şəkil (JPG / PNG)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Format və Ölçü Seçimi:</label>
        <select id="downloadFormat" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
        </select>
      </div>

      <button onclick="startProcessing()" id="processBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold text-xs rounded-xl transition">
        <span id="t_process_btn">Mediayə Bax / Hazırla</span>
      </button>

      <!-- Progress Bar -->
      <div id="progressContainer" class="flex flex-col gap-2 hidden">
        <div class="flex justify-between text-xs text-slate-400">
          <span id="progressStatusText">Hazırlanır...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="w-full bg-slate-950 rounded-full h-3 border border-slate-800 overflow-hidden">
          <div id="progressBar" class="bg-gradient-to-r from-rose-500 to-indigo-500 h-full w-0 transition-all duration-200"></div>
        </div>
      </div>
    </div>

    <!-- Pleyer -->
    <div id="playerBox" class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col gap-4 hidden shadow-2xl">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
        <i data-lucide="play-circle" class="w-4 h-4 text-emerald-400"></i>
        Önizləmə
      </h2>
      <div id="playerContent" class="w-full bg-slate-950 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center p-2 min-h-[150px]"></div>
      
      <a id="fileDownloadBtn" download href="#" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
        <i data-lucide="download" class="w-4 h-4"></i>
        <span id="t_download_btn">Telefona Yüklə</span>
      </a>
    </div>

    <!-- Tarixçə -->
    <section class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex flex-col gap-3 shadow-xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h2 id="t_history_title" class="font-bold text-xs text-slate-300 flex items-center gap-2">
          <i data-lucide="database" class="w-4 h-4 text-rose-500"></i>
          Yükləmələr Siyahısı
        </h2>
        <div class="flex items-center gap-2">
          <span id="dbCount" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-rose-400 font-bold">0 Fayl</span>
          <button onclick="clearAllHistory()" class="px-2 py-1 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded-lg text-[10px] font-bold transition flex items-center gap-1">
            <i data-lucide="trash-2" class="w-3 h-3"></i> <span id="t_clear_all">Hamısını Sil</span>
          </button>
        </div>
      </div>
      <div id="historyList" class="flex flex-col gap-2 max-h-60 overflow-y-auto"></div>
    </section>

    <!-- Aşağı Reklam Konteyneri -->
    <div id="bottomAdsContainer" class="flex flex-col gap-3 mt-2"></div>

  </div>

  <script>
    lucide.createIcons();
    let currentUrl = '';
    let currentTitle = '';
    let deferredPrompt;
    let globalConfig = {};
    let currentLang = 'az';

    async function loadConfigAndAds() {
      try {
        const res = await fetch('/api/config');
        globalConfig = await res.json();
        
        if (globalConfig.site_logo) {
          const img = document.getElementById('siteLogoImg');
          const icon = document.getElementById('siteLogoIcon');
          img.src = globalConfig.site_logo;
          img.classList.remove('hidden');
          icon.classList.add('hidden');
        }

        applyLanguage(currentLang);
        loadAds();
      } catch (e) {
        console.error(e);
      }
    }

    async function loadAds() {
      try {
        const res = await fetch('/api/ads');
        const ads = await res.json();

        const topContainer = document.getElementById('topAdsContainer');
        const bottomContainer = document.getElementById('bottomAdsContainer');
        topContainer.innerHTML = '';
        bottomContainer.innerHTML = '';

        ads.forEach(ad => {
          const adHTML = `
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3 shadow-xl flex flex-col gap-2">
              <div class="flex justify-between items-center">
                <span class="text-[10px] font-bold text-rose-400 uppercase tracking-widest">📢 Reklam</span>
                <span class="text-[10px] text-slate-400 font-medium">${ad.title}</span>
              </div>
              ${ad.media_url ? `
                <a href="${ad.link || '#'}" target="_blank">
                  <img src="${ad.media_url}" class="w-full h-auto rounded-xl object-cover max-h-40 border border-slate-800">
                </a>
              ` : ''}
              ${ad.html_code ? `<div>${ad.html_code}</div>` : ''}
              ${ad.link && !ad.media_url ? `
                <a href="${ad.link}" target="_blank" class="py-2 bg-rose-600 hover:bg-rose-500 text-center text-xs font-bold rounded-xl transition">Keçid Et</a>
              ` : ''}
            </div>
          `;

          if (ad.position === 'top') {
            topContainer.innerHTML += adHTML;
          } else {
            bottomContainer.innerHTML += adHTML;
          }
        });
      } catch (e) {
        console.error(e);
      }
    }

    function changeLanguage(lang) {
      currentLang = lang;
      applyLanguage(lang);
    }

    function applyLanguage(lang) {
      if (!globalConfig.translations || !globalConfig.translations[lang]) return;
      const t = globalConfig.translations[lang];

      document.getElementById('pageTitle').innerText = t.title;
      document.getElementById('t_title').innerText = t.title;
      document.getElementById('t_subtitle').innerText = t.subtitle;
      document.getElementById('t_input_label').innerText = t.input_label;
      document.getElementById('mediaUrl').placeholder = t.input_placeholder;
      document.getElementById('t_analyze_btn').innerText = t.analyze_btn;
      document.getElementById('t_select_type_label').innerText = t.select_type_label;
      document.getElementById('t_video_opt').innerText = "🎥 " + (lang === 'en' ? "Video (MP4)" : lang === 'ru' ? "Видео (MP4)" : "Video (MP4)");
      document.getElementById('t_audio_opt').innerText = "🎵 " + (lang === 'en' ? "Music / Audio (MP3)" : lang === 'ru' ? "Музыка / Аудио (MP3)" : "Musiqi / Audio (MP3)");
      document.getElementById('t_image_opt').innerText = "🖼️ " + (lang === 'en' ? "Image (JPG / PNG)" : lang === 'ru' ? "Картинка (JPG / PNG)" : "Şəkil (JPG / PNG)");
      document.getElementById('t_process_btn').innerText = t.process_btn;
      document.getElementById('t_download_btn').innerText = t.download_btn;
      document.getElementById('t_history_title').innerText = t.history_title;
      document.getElementById('t_clear_all').innerText = t.clear_all;
      document.getElementById('t_install_app').innerText = t.install_app;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').classList.remove('hidden');
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') document.getElementById('installBtn').classList.add('hidden');
          deferredPrompt = null;
        });
      }
    }

    function updateFormats() {
      const type = document.getElementById('downloadType').value;
      const formatSelect = document.getElementById('downloadFormat');
      formatSelect.innerHTML = '';
      if (type === 'video') {
        formatSelect.innerHTML = `<option value="mp4_best">MP4 (Yüksək Keyfiyyət)</option><option value="mp4_small">MP4 (Ən Kiçik Həcm / Sürətli)</option>`;
      } else if (type === 'audio') {
        formatSelect.innerHTML = `<option value="mp3_best">MP3 (Yüksək Keyfiyyət 320kbps)</option><option value="mp3_small">MP3 (Ən Kiçik Həcm / Sıxılmış)</option>`;
      } else if (type === 'image') {
        formatSelect.innerHTML = `<option value="jpg">JPG Şəkil</option><option value="png">PNG Şəkil</option>`;
      }
    }

    async function analyzeUrl() {
      const url = document.getElementById('mediaUrl').value.trim();
      if (!url) return alert('Link daxil edin');
      currentUrl = url;
      const btn = document.getElementById('analyzeBtn');
      btn.innerText = 'Analiz olunur...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        currentTitle = data.title;
        document.getElementById('mediaInfo').innerText = `📌 ${currentTitle}`;
        document.getElementById('resultBox').classList.remove('hidden');
        document.getElementById('playerBox').classList.add('hidden');
        updateFormats();
      } catch (err) {
        alert(err.message || 'Xəta baş verdi');
      } finally {
        btn.innerText = globalConfig.translations[currentLang].analyze_btn;
        btn.disabled = false;
      }
    }

    function startProcessing() {
      const type = document.getElementById('downloadType').value;
      const format = document.getElementById('downloadFormat').value;
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const progressPercent = document.getElementById('progressPercent');
      const progressStatusText = document.getElementById('progressStatusText');
      const btn = document.getElementById('processBtn');
      const playerBox = document.getElementById('playerBox');

      progressContainer.classList.remove('hidden');
      playerBox.classList.add('hidden');
      progressBar.style.width = '0%';
      progressBar.classList.remove('animate-pulse');
      progressPercent.innerText = '0%';
      progressStatusText.innerText = 'Hazırlanır...';
      btn.disabled = true;

      const eventSource = new EventSource(`/api/download-stream?url=${encodeURIComponent(currentUrl)}&type=${type}&format=${format}&title=${encodeURIComponent(currentTitle)}`);

      eventSource.onmessage = function(event) {
        const data = JSON.parse(event.data);
        if (data.status === 'downloading') {
          progressBar.style.width = data.percent + '%';
          progressBar.classList.remove('animate-pulse');
          progressPercent.innerText = data.percent + '%';
          progressStatusText.innerText = '📥 Fayl internetdən yüklənir...';
        } else if (data.status === 'converting') {
          progressBar.style.width = '100%';
          progressBar.classList.add('animate-pulse');
          if (data.time) {
            progressPercent.innerText = data.time;
            progressStatusText.innerText = `⚙️ Emal olunur (Keçən vaxt: ${data.time})...`;
          } else {
            progressPercent.innerText = 'Çevrilir...';
            progressStatusText.innerText = '⚙️ Video/Musiqi formatı birləşdirilir, gözləyin...';
          }
        } else if (data.status === 'completed') {
          progressBar.style.width = '100%';
          progressBar.classList.remove('animate-pulse');
          progressPercent.innerText = '100%';
          progressStatusText.innerText = '✅ Hazırdır!';
          eventSource.close();
          btn.disabled = false;
          renderPlayer(data.downloadUrl, type);
          loadHistory();
        } else if (data.status === 'error') {
          alert(data.message || 'Xəta baş verdi');
          eventSource.close();
          btn.disabled = false;
        }
      };
    }

    function renderPlayer(fileUrl, type) {
      const playerBox = document.getElementById('playerBox');
      const playerContent = document.getElementById('playerContent');
      const downloadBtn = document.getElementById('fileDownloadBtn');
      playerContent.innerHTML = '';
      downloadBtn.href = fileUrl;

      if (type === 'video') {
        playerContent.innerHTML = `<video controls class="w-full rounded-lg max-h-60 bg-black"><source src="${fileUrl}" type="video/mp4"></video>`;
      } else if (type === 'audio') {
        playerContent.innerHTML = `<div class="w-full flex flex-col items-center gap-2 py-2"><audio controls class="w-full"><source src="${fileUrl}" type="audio/mp3"></audio></div>`;
      } else if (type === 'image') {
        playerContent.innerHTML = `<img src="${fileUrl}" class="w-full h-auto rounded-lg max-h-60 object-contain">`;
      }
      playerBox.classList.remove('hidden');
      lucide.createIcons();
    }

    async function loadHistory() {
      try {
        const res = await fetch('/api/history');
        const items = await res.json();
        const list = document.getElementById('historyList');
        document.getElementById('dbCount').innerText = items.length + ' Fayl';

        if (items.length === 0) {
          list.innerHTML = `<p class="text-slate-500 text-xs text-center py-3">Siyahı boşdur</p>`;
          return;
        }

        list.innerHTML = items.map(item => `
          <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800/60 text-xs">
            <div class="flex flex-col gap-1 overflow-hidden pr-2">
              <span class="font-medium text-slate-200 truncate">${item.title}</span>
              <span class="text-[10px] text-slate-500">${item.date}</span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <a href="${item.file_url}" target="_blank" class="px-2.5 py-1 bg-rose-600/20 text-rose-400 rounded-lg hover:bg-rose-600 hover:text-white transition font-bold">Aç</a>
              <button onclick="deleteHistoryItem('${item.id}')" class="p-1 bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white rounded-lg transition" title="Sil"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
            </div>
          </div>`).join('');
        lucide.createIcons();
      } catch (e) {}
    }

    async function deleteHistoryItem(id) {
      if (!confirm('Silmək istədiyinizə əminsiniz?')) return;
      await fetch('/api/history/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
      loadHistory();
    }

    async function clearAllHistory() {
      if (!confirm('Hamısı silinsin?')) return;
      await fetch('/api/history/clear-all', { method: 'POST' });
      loadHistory();
      document.getElementById('playerBox').classList.add('hidden');
    }

    loadConfigAndAds();
    loadHistory();
  </script>
</body>
</html>
