<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Xankişi</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4 flex flex-col items-center">

  <div class="max-w-md w-full bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl mt-4 mb-8">
    <h1 class="text-base font-bold text-rose-500 mb-4 text-center">🔐 Xankişi İdarəetmə Paneli</h1>

    <!-- Login Form -->
    <div id="loginBox" class="flex flex-col gap-3">
      <input type="text" id="adminUser" placeholder="İstifadəçi adı" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
      <input type="password" id="adminPass" placeholder="Şifrə" class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
      <button onclick="loginAdmin()" class="py-3 bg-rose-600 hover:bg-rose-500 font-bold text-xs rounded-xl transition">Daxil Ol</button>
    </div>

    <!-- Əsas Panel (Login Olandan Sonra Görünür) -->
    <div id="panelBox" class="flex flex-col gap-4 hidden">
      
      <!-- Yuxarıda Mini Düymələr (Tablar) -->
      <div class="grid grid-cols-2 gap-2 border-b border-slate-800 pb-4">
        <button onclick="switchSection('ads')" id="nav_ads" class="py-2 px-3 bg-rose-600 text-white rounded-xl text-xs font-bold transition text-center shadow-md">📢 Reklamlar</button>
        <button onclick="switchSection('stats')" id="nav_stats" class="py-2 px-3 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold transition text-center">📊 Statistika</button>
        <button onclick="switchSection('langs')" id="nav_langs" class="py-2 px-3 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold transition text-center">🌐 Dillər</button>
        <button onclick="switchSection('settings')" id="nav_settings" class="py-2 px-3 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold transition text-center">⚙️ Ayarlar</button>
      </div>

      <!-- BÖLMƏ 1: Reklam İdarəetməsi -->
      <div id="section_ads" class="flex flex-col gap-3">
        <h2 class="text-xs font-bold text-rose-400">📢 Yeni Reklam Əlavə Et</h2>
        <input type="text" id="adTitle" placeholder="Reklam Başlığı" class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white">
        <input type="text" id="adLink" placeholder="Keçid Linki (URL)" class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white">
        <input type="text" id="adMedia" placeholder="Şəkil / Video Linki (URL)" class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white">
        <textarea id="adHtml" placeholder="HTML / Skript / Kodlar" rows="2" class="bg-slate-950 border border-slate-800 rounded-lg p-2 text-[11px] text-emerald-400 font-mono"></textarea>
        
        <div class="flex gap-2">
          <select id="adPos" class="w-1/2 bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white">
            <option value="top">Yuxarıda</option>
            <option value="bottom" selected>Aşağıda</option>
          </select>
          <button onclick="addNewAd()" class="w-1/2 py-2 bg-rose-600 hover:bg-rose-500 font-bold text-xs rounded-lg transition">Yayımla</button>
        </div>

        <div class="border-t border-slate-800 pt-3 mt-1">
          <h3 class="text-xs font-bold text-slate-400 mb-2">Mövcud Reklamlar</h3>
          <div id="adsManageList" class="flex flex-col gap-2 max-h-44 overflow-y-auto"></div>
        </div>
      </div>

      <!-- BÖLMƏ 2: Statistika -->
      <div id="section_stats" class="flex flex-col gap-3 hidden">
        <h2 class="text-xs font-bold text-rose-400">📊 Ziyarətçi Sayı (Günlər üzrə)</h2>
        <div id="statsList" class="flex flex-col gap-2 max-h-56 overflow-y-auto text-xs text-slate-300"></div>
      </div>

      <!-- BÖLMƏ 3: Dil və Mətn Redaktəsi -->
      <div id="section_langs" class="flex flex-col gap-3 hidden">
        <h2 class="text-xs font-bold text-rose-400">🌐 Dil Redaktəsi</h2>
        <div class="flex border-b border-slate-800 pb-2 gap-2">
          <button onclick="switchTab('az')" id="tab_az" class="px-3 py-1 bg-rose-600 text-white rounded-lg text-xs font-bold">AZ</button>
          <button onclick="switchTab('en')" id="tab_en" class="px-3 py-1 bg-slate-800 text-slate-400 rounded-lg text-xs font-bold">EN</button>
          <button onclick="switchTab('ru')" id="tab_ru" class="px-3 py-1 bg-slate-800 text-slate-400 rounded-lg text-xs font-bold">RU</button>
        </div>
        <div id="langFields" class="flex flex-col gap-2 max-h-48 overflow-y-auto"></div>
        <button onclick="saveConfig()" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs rounded-xl transition">Yadda Saxla</button>
      </div>

      <!-- BÖLMƏ 4: Ümumi Ayarlar (Qalereyadan Loqo Seçimi ilə) -->
      <div id="section_settings" class="flex flex-col gap-3 hidden">
        <h2 class="text-xs font-bold text-rose-400">⚙️ Sistem Ayarları</h2>
        <div>
          <label class="block text-[10px] text-slate-400 mb-1">Admin Login və Şifrə:</label>
          <div class="flex gap-2">
            <input type="text" id="newAdminUser" class="w-1/2 bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white" placeholder="Login">
            <input type="text" id="newAdminPass" class="w-1/2 bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white" placeholder="Şifrə">
          </div>
        </div>

        <!-- Qalereyadan Şəkil Seçmə Bölməsi -->
        <div>
          <label class="block text-[10px] text-slate-400 mb-1">Saytın Loqosu (Kompyuter və ya Telefondan Seç):</label>
          <input type="file" id="logoFileInput" accept="image/*" onchange="handleLogoUpload(this)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-slate-300 file:mr-3 file:py-1 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-bold file:bg-rose-600 file:text-white hover:file:bg-rose-500">
        </div>
        <div class="flex justify-center my-1">
          <img id="logoPreview" src="" class="w-12 h-12 object-cover rounded-xl border border-slate-800 hidden">
        </div>

        <button onclick="saveConfig()" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 font-bold text-xs rounded-xl transition">Yadda Saxla</button>
      </div>

      <a href="/" class="text-center text-xs text-slate-400 hover:text-white underline mt-2">← Əsas səhifəyə qayıt</a>
    </div>
  </div>

  <script>
    let currentConfig = {};
    let activeTab = 'az';
    let uploadedLogoBase64 = '';

    async function loginAdmin() {
      const username = document.getElementById('adminUser').value;
      const password = document.getElementById('adminPass').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('panelBox').classList.remove('hidden');
        loadAdminData();
      } else {
        alert(data.error);
      }
    }

    function switchSection(sec) {
      ['ads', 'stats', 'langs', 'settings'].forEach(s => {
        document.getElementById(`section_${s}`).classList.add('hidden');
        document.getElementById(`nav_${s}`).className = "py-2 px-3 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold transition text-center";
      });
      document.getElementById(`section_${sec}`).classList.remove('hidden');
      document.getElementById(`nav_${sec}`).className = "py-2 px-3 bg-rose-600 text-white rounded-xl text-xs font-bold transition text-center shadow-md";
    }

    // Qalereyadan seçilən şəkli Base64 formatına çevirmək
    function handleLogoUpload(input) {
      const file = input.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          uploadedLogoBase64 = e.target.result;
          const preview = document.getElementById('logoPreview');
          preview.src = uploadedLogoBase64;
          preview.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    }

    async function loadAdminData() {
      const res = await fetch('/api/config');
      currentConfig = await res.json();
      document.getElementById('newAdminUser').value = currentConfig.admin_user || '';
      document.getElementById('newAdminPass').value = currentConfig.admin_pass || '';
      
      if (currentConfig.site_logo) {
        uploadedLogoBase64 = currentConfig.site_logo;
        const preview = document.getElementById('logoPreview');
        preview.src = uploadedLogoBase64;
        preview.classList.remove('hidden');
      }

      loadStats();
      loadAdsManager();
      renderLangFields(activeTab);
    }

    async function loadStats() {
      const res = await fetch('/api/admin/stats');
      const stats = await res.json();
      const statsList = document.getElementById('statsList');
      const keys = Object.keys(stats).sort().reverse();
      statsList.innerHTML = keys.length === 0 ? `<span class="text-slate-500">Məlumat yoxdur</span>` : keys.map(d => `
        <div class="flex justify-between bg-slate-950 p-2 rounded-lg border border-slate-800">
          <span>📅 ${d}</span><span class="text-rose-400 font-bold">${stats[d]} nəfər</span>
        </div>`).join('');
    }

    async function loadAdsManager() {
      const res = await fetch('/api/admin/ads');
      const ads = await res.json();
      const list = document.getElementById('adsManageList');
      list.innerHTML = ads.length === 0 ? `<span class="text-slate-500 text-xs">Reklam yoxdur</span>` : ads.map(ad => `
        <div class="flex items-center justify-between bg-slate-950 p-2 rounded-lg border border-slate-800 text-xs">
          <div class="flex flex-col gap-0.5 overflow-hidden pr-2">
            <span class="font-bold text-slate-200 truncate">${ad.title}</span>
            <span class="text-[10px] text-slate-400">${ad.position} | ${ad.active ? 'Aktiv ✅' : 'Deaktiv ❌'}</span>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="toggleAdStatus('${ad.id}', ${!ad.active})" class="px-2 py-1 bg-indigo-600/20 text-indigo-400 rounded">${ad.active ? 'Dayandır' : 'Aktiv et'}</button>
            <button onclick="deleteAd('${ad.id}')" class="p-1 bg-red-600/20 text-red-400 rounded">Sil</button>
          </div>
        </div>`).join('');
    }

    async function addNewAd() {
      const title = document.getElementById('adTitle').value;
      const link = document.getElementById('adLink').value;
      const media_url = document.getElementById('adMedia').value;
      const html_code = document.getElementById('adHtml').value;
      const position = document.getElementById('adPos').value;

      if (!title) return alert('Başlıq daxil edin');

      await fetch('/api/admin/ads/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, link, media_url, html_code, position, active: true })
      });

      document.getElementById('adTitle').value = '';
      document.getElementById('adLink').value = '';
      document.getElementById('adMedia').value = '';
      document.getElementById('adHtml').value = '';
      loadAdsManager();
      alert('✅ Reklam yayımlandı!');
    }

    async function toggleAdStatus(id, newStatus) {
      const res = await fetch('/api/admin/ads');
      const ads = await res.json();
      const ad = ads.find(a => a.id === id);
      if (ad) {
        ad.active = newStatus;
        await fetch('/api/admin/ads/update', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(ad) });
        loadAdsManager();
      }
    }

    async function deleteAd(id) {
      if (!confirm('Silinsin?')) return;
      await fetch('/api/admin/ads/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
      loadAdsManager();
    }

    function switchTab(lang) {
      activeTab = lang;
      ['az', 'en', 'ru'].forEach(l => {
        document.getElementById(`tab_${l}`).className = l === lang ? "px-3 py-1 bg-rose-600 text-white rounded-lg text-xs font-bold" : "px-3 py-1 bg-slate-800 text-slate-400 rounded-lg text-xs font-bold";
      });
      renderLangFields(lang);
    }

    function renderLangFields(lang) {
      const container = document.getElementById('langFields');
      const t = currentConfig.translations[lang] || {};
      const labels = {
        title: "Əsas Başlıq", subtitle: "Alt Başlıq", input_label: "Link Giriş Başlığı",
        input_placeholder: "Input Nümunə", analyze_btn: "Analiz Et Düyməsi",
        select_type_label: "Format Seçimi", process_btn: "Hazırla Düyməsi",
        download_btn: "Yüklə Düyməsi", history_title: "Siyahı Başlığı",
        clear_all: "Hamısını Sil", install_app: "Tətbiqi Quraşdır"
      };

      container.innerHTML = Object.keys(labels).map(key => `
        <div>
          <label class="block text-[10px] text-slate-400 mb-0.5">${labels[key]} (${lang.toUpperCase()}):</label>
          <input type="text" id="field_${key}" value="${t[key] || ''}" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white">
        </div>
      `).join('');
    }

    async function saveConfig() {
      try {
        currentConfig.admin_user = document.getElementById('newAdminUser').value;
        currentConfig.admin_pass = document.getElementById('newAdminPass').value;
        if (uploadedLogoBase64) {
          currentConfig.site_logo = uploadedLogoBase64;
        }

        const t = currentConfig.translations[activeTab];
        Object.keys(t).forEach(key => {
          const input = document.getElementById(`field_${key}`);
          if (input) t[key] = input.value;
        });

        const res = await fetch('/api/admin/update-config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentConfig)
        });
        const data = await res.json();
        if (data.success) alert('✅ Bütün tənzimləmələr yadda saxlanıldı!');
      } catch (e) {
        alert('Xəta baş verdi');
      }
    }
  </script>
</body>
</html>
